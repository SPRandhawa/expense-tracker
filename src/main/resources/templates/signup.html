<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sign Up</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            font-family: Arial, sans-serif;
            color: #f1f5f9;
        }


    .card {
        background: #1e293b;
        padding: 30px;
        border-radius: 12px;
        width: 300px;
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
        background: linear-gradient(90deg, #6a11cb, #2575fc);
        -webkit-background-clip: text;
        color: transparent;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 6px;
        border: none;
        outline: none;
        background: #334155;
        color: white;
    }

    button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border: none;
        border-radius: 6px;
        background: #8b5cf6;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #7c3aed;
    }

    a {
        display: block;
        margin-top: 15px;
        color: #3b82f6;
        text-decoration: none;
    }

    a:hover {
        color: #f97316;
    }
</style>


</head>
<body>

<div class="card">
    <h2>Sign Up 📝</h2>


<form method="post" th:action="@{/signup}">
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Register</button>
</form>

<a href="/login">Already have account? Login</a>


</div>

</body>
</html>
