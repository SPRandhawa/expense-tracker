<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Expense</title>
</head>
<body style="text-align:center; background:#0f172a; color:white;">

<h2>Edit Expense ✏️</h2>

<form th:action="@{/update/{id}(id=${expense.id})}" method="post">
    <input type="text" name="title" th:value="${expense.title}" required><br><br>
    <input type="number" name="amount" th:value="${expense.amount}" required><br><br>
    <input type="text" name="category" th:value="${expense.category}" required><br><br>
    <input type="date" name="date" th:value="${expense.date}" required><br><br>
    <button type="submit">Update</button>
</form>

</body>
</html>
